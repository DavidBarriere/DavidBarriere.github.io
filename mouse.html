      en: "AMBMC template. Strain: C57BL/6J. Age: 12 weeks. Sex: male. Number of animals: n = 18. Acquisition: 16.4 T. Spatial resolution: 15 µm isotropic. Ex vivo, 0.1% Magnevist®.\n\nAllen Mouse Brain Atlas. Strain: C57BL/6J. Age: 12 weeks. Sex: male (60%) and female (40%). Acquisition: two-photon tomography. Spatial resolution: 10 µm isotropic.\n\nTurone Mouse Brain Template and Atlas (TMBTA): the template is a variant of the AMBMC template, whose resolution was reduced to 60 µm isotropic to allow MRI data analysis. The atlas is a combination of the Allen Brain Project and AMBMC atlases, chosen to find the best compromise for identifying brain territories in MRI. The hippocampus, cerebellum, neocortex, basal ganglia and diencephalon come from AMBMC, while the rest comes from the Allen Brain Project. Finally, grey matter, white matter and cerebrospinal fluid probability maps are provided for automated segmentation procedures.",
      fr: "Template AMBMC. Souche : C57BL/6J. Âge : 12 semaines. Sexe : mâles. Nombre d'animaux : n = 18. Acquisition : 16,4 T. Résolution spatiale : 15 µm isotropique. Ex vivo, 0,1 % Magnevist®.\n\nAllen Mouse Brain Atlas. Souche : C57BL/6J. Âge : 12 semaines. Sexe : mâles (60 %) et femelles (40 %). Acquisition : tomographie biphotonique. Résolution spatiale : 10 µm isotropique.\n\nTurone Mouse Brain Template and Atlas (TMBTA) : le template est une variante du template AMBMC dont la résolution a été réduite à 60 µm isotropique pour permettre l'analyse des données IRM. L'atlas est une combinaison entre les atlas issus de l'Allen Brain Project et de l'AMBMC, afin de trouver le meilleur compromis pour l'identification des territoires cérébraux en IRM. L'hippocampe, le cervelet, le néocortex, les ganglions de la base et le diencéphale sont issus de l'AMBMC, le reste provient de l'Allen Brain Project. Enfin, des cartes de probabilité de matière grise, de matière blanche et de liquide céphalorachidien sont fournies pour les procédures de segmentation automatique.",

      en: "The Turone Mouse Brain Template and Atlas (TMBTA) resources offer the preclinical neuroimaging community a unified and standardised framework for the analysis of multimodal mouse brain data, allowing results to be reported in the coordinate system of the Allen Brain Project atlas, the reference in the field. The TMBTA resources were developed as part of the ImaCervoRepro project, a collaborative project funded by the regional council of the Centre-Val de Loire (agreement 201500104011, 2015-2018).",
