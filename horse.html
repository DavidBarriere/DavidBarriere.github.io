<div id="app"></div>

<script type="module">

  initBrainViewer({
    rootId: "app",
    defaultLang: "en",
    labName: "DABLab",
    labInitials: "DAB",
    logoUrl: null,
    cnrsLogoUrl: "./assets/img/cnrs.svg",
    siteHomeUrl: "./tools.html",
    commonName: { en: "Horse", fr: "Cheval" },
    latinName: "Equus caballus",
    atlasName: "Turone Equine Brain Template and Atlas (TEBTA)",
    atlasSpecs: {
      en: "Strain: Welsh. Age: 6 months. Sex: males (11) and females (12). Number of animals: n = 23. Acquisition: 3 T. Weighting: T1. Spatial resolution: 1 mm isotropic. In vivo.",
      fr: "Souche : Welsh. Âge : 6 mois. Sexe : mâles (11) et femelles (12). Nombre d'animaux : n = 23. Acquisition : 3 T. Pondération : T1. Résolution spatiale : 1 mm isotropique. In vivo.",
    },
    atlasReferences: [
      { text: "Johnson PJ, Janvier V, Luh WM, FitzMaurice M, Southard T, Barry EF. (2019) Equine stereotaxic population average brain atlas with neuroanatomic correlation. Frontiers in Neuroanatomy 13:89. doi:10.3389/fnana.2019.00089. PMID:31636547", url: "https://doi.org/10.3389/fnana.2019.00089" },
